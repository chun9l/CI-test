name: slurm-ci

on: push

jobs:
  test-on-slurm:
    runs-on: ubuntu-latest
    container:
      image: giovtorres/slurm-docker
      options: --cap-add sys_admin --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Start Slurm daemons
        run: |
          timeout 120 bash -c 'until scontrol ping 2>/dev/null | grep -q "UP"; do
            echo "Waiting for slurmctld..."
            sleep 5
          done'
          echo "slurmctld is ready"
          sinfo 
          scontrol show nodes

      - name: Submit a job
        run: srun -p normal hostname